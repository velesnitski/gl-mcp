name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: gl-mcp-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gl-mcp-aarch64-macos
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: gl-mcp-x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gl-mcp-x86_64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Copy artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/gl-mcp ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
      - name: Copy artifact (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\gl-mcp.exe ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store it, verifiable with `gh attestation verify`
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
      # Build provenance: proves each binary came from this workflow at this tag.
      # A checksum next to the file only proves the download is intact.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/gl-mcp-*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checksums for consumers that sync releases elsewhere (ADR 071).
          (cd release && sha256sum gl-mcp-* > SHA256SUMS && cat SHA256SUMS)

          # Extract changelog for this version
          VERSION=${GITHUB_REF_NAME#v}
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi

          # Create GitHub release
          gh release create "$GITHUB_REF_NAME" \
            --title "gl-mcp $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            release/*
